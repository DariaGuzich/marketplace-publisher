spring.application.name=marketplace-publisher
# HTTP-сервер не нужен: publisher только читает outbox и отправляет в Serving
spring.main.web-application-type=none

# База marketplace-api (упрощение: publisher читает outbox прямо из неё, см. README)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD:marketplace}

publisher.serving-url=${SERVING_URL:http://localhost:8081}
# Пауза между циклами чтения outbox
publisher.poll-interval-ms=${POLL_INTERVAL_MS:3000}
# Сколько раз пытаться отправить одну запись в Serving и с какой паузой
publisher.retry-attempts=${RETRY_ATTEMPTS:3}
publisher.retry-delay-ms=${RETRY_DELAY_MS:1000}
# true — процесс падает сразу после отправки в Serving, до пометки записи как SENT (повторная доставка)
publisher.crash-after-send=${CRASH_AFTER_SEND:false}
# false — не запускать цикл по расписанию (в тестах цикл вызывается вручную)
publisher.scheduling-enabled=true
